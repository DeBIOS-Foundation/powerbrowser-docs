name: doc-gap triage
on:
  issues:
    types: [opened, edited]
permissions: {}
# IN-03: one run at a time per issue, so overlapping edits cannot both post the duplicate comment. Queued runs wait; none is cancelled.
concurrency:
  group: doc-gap-${{ github.event.issue.number }}
  cancel-in-progress: false
jobs:
  triage:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - name: Triage the doc-gap issue
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/triage-doc-gap.mjs
